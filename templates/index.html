<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial AI Sights - Analizador Financiero</title>
    <!-- Enlazamos de forma nativa el archivo CSS guardado en la carpeta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="header-container">
            <div>
                <h1>Financial AI Sights</h1>
                <p>Plataforma de Analítica Financiera Avanzada</p>
            </div>
            <span class="badge">Plan Gratuito Activo</span>
        </div>
    </header>

    <main>
        <!-- Panel Izquierdo: Formulario -->
        <section class="panel">
            <h2>Análisis de Documento</h2>
            <form id="uploadForm" enctype="multipart/form-data">

                <div class="form-group">
                    <label>Estado de cuenta / Flujo de efectivo</label>
                    <div class="dropzone">
                        <input type="file" name="financial_file" id="financial_file" accept=".pdf, .png, .jpg, .jpeg" required>
                        <div class="dropzone-text">
                            <span class="dropzone-icon">📄</span>
                            <strong>Seleccionar o arrastrar archivo</strong>
                            <div style="font-size: 11px; margin-top:4px;">(PDF, PNG, JPG)</div>
                        </div>
                    </div>
                    <span id="fileName" style="display:block; margin-top:8px; font-size:12px; color:#16a34a; font-weight:500;"></span>
                </div>

                <div class="form-group">
                    <label for="prompt">Enfoque o instrucción (Opcional)</label>
                    <textarea name="prompt" id="prompt" rows="4" placeholder="Ej. Detecta anomalías, resume los gastos más altos o analiza la liquidez disponible..."></textarea>
                </div>

                <button type="submit">Generar Resumen</button>
            </form>
        </section>

        <!-- Panel Derecho: Resultados -->
        <section class="panel" style="display: flex; flex-direction: column;">
            <h2>📊 Resultados del Diagnóstico Financiero</h2>
            <div id="resultContent" class="result-box">
                <span class="placeholder-text">Los resultados aparecerán aquí tras procesar el documento.</span>
            </div>
        </section>
    </main>

    <script>
        // Mostrar el nombre del archivo seleccionado en pantalla
        document.getElementById('financial_file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            document.getElementById('fileName').textContent = file ? `Archivo cargado: ${file.name}` : '';
        });

        // Enviar datos vía AJAX sin recargar la página entera
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = '<span class="loading-text">Analizando balances y procesando transacciones con Gemini...</span>';

            const formData = new FormData(this);
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });
                const text = await response.text();
                resultContent.textContent = text;
            } catch (error) {
                resultContent.innerHTML = '<span style="color:#dc2626; font-weight:500;">Ocurrió un error al intentar conectar con el servidor de análisis.</span>';
            }
        });
    </script>
</body>
</html>
